name: Patch Image via URL

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Direct Gofile download URL"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget lz4 tar openssl python3

      - name: Download recovery image
        run: |
          wget --content-disposition -O recovery.img "${{ github.event.inputs.image_url }}"

      - name: Start patching script
        run: |
          chmod +x magiskboot patcher-minimal
          ./patcher-minimal

      - name: Upload patched image files
        uses: actions/upload-artifact@v4
        with:
          path: output/*.*
          name: Patched Recovery Image Bundle
          if-no-files-found: error
          retention-days: 15
          compression-level: 0
          overwrite: true

      - name: Upload keys
        uses: actions/upload-artifact@v4
        with:
          path: keys/*.*
          name: Patched Image Key Bundle
          if-no-files-found: error
          retention-days: 15
          compression-level: 0
          overwrite: true
